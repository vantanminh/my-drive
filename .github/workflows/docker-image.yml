name: Docker images

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=my-drive

      - name: Build media indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: media-indexer-runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=my-drive-indexer

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase GHCR image names
        id: images
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'app=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'indexer=%s-indexer\n' "$repository" >> "$GITHUB_OUTPUT"

      - name: Extract application image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Extract media indexer image metadata
        id: indexer-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.indexer }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha,scope=my-drive
          cache-to: type=gha,scope=my-drive,mode=max

      - name: Build and publish media indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: media-indexer-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.indexer-meta.outputs.tags }}
          labels: ${{ steps.indexer-meta.outputs.labels }}
          cache-from: type=gha,scope=my-drive-indexer
          cache-to: type=gha,scope=my-drive-indexer,mode=max
