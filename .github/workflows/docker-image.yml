name: Docker images

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --all-targets --locked

      - name: Run Rust lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check encrypted secret backup compatibility
        run: python3 scripts/test_storage_archive.py

      - name: Check VPS host updater helpers
        run: python3 scripts/test_vps_updater.py

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=my-drive

      - name: Build media indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: media-indexer-runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=my-drive-indexer

      - name: Build isolated document preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: document-preview-runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=my-drive-document-preview

      - name: Build indexer database setup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: media-indexer-db-setup
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=my-drive-indexer-db-setup

  database-fixture:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mydrive
          POSTGRES_USER: mydrive
          POSTGRES_PASSWORD: ci-fixture-password-0123456789
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydrive -d mydrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run disposable PostgreSQL integration fixtures
        env:
          TEST_DATABASE_URL: postgres://mydrive:ci-fixture-password-0123456789@127.0.0.1:5432/mydrive
        run: cargo test --all-targets --locked -- --ignored --test-threads=1

  physical-mount-fixture:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify separate HDD and SSD mount guards
        shell: bash
        run: |
          set -euo pipefail
          hdd_mount=/mnt/my-drive-hdd
          ssd_mount=/mnt/my-drive-ssd
          hdd_image="$RUNNER_TEMP/my-drive-hdd.img"
          cleanup() {
            sudo umount "$ssd_mount" 2>/dev/null || true
            sudo umount "$hdd_mount" 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo mkdir -p "$hdd_mount" "$ssd_mount"
          truncate -s 256M "$hdd_image"
          sudo mkfs.ext4 -F "$hdd_image"
          sudo mount --options loop "$hdd_image" "$hdd_mount"
          sudo mount --type tmpfs --options size=256M my-drive-preview "$ssd_mount"
          sudo mkdir -p "$hdd_mount/data" "$ssd_mount/previews"
          sudo chown -R "$(id -u):$(id -g)" "$hdd_mount" "$ssd_mount"

          hdd_device="$(findmnt --noheadings --output MAJ:MIN --target "$hdd_mount" | xargs)"
          ssd_device="$(findmnt --noheadings --output MAJ:MIN --target "$ssd_mount" | xargs)"
          test -n "$hdd_device"
          test -n "$ssd_device"
          test "$hdd_device" != "$ssd_device"

          export MY_DRIVE_MOUNT_STORAGE_ROOT="$hdd_mount/data"
          export MY_DRIVE_MOUNT_STORAGE_MOUNT="$hdd_mount"
          export MY_DRIVE_MOUNT_STORAGE_DEVICE="$hdd_device"
          export MY_DRIVE_MOUNT_PREVIEW_ROOT="$ssd_mount/previews"
          export MY_DRIVE_MOUNT_PREVIEW_MOUNT="$ssd_mount"
          export MY_DRIVE_MOUNT_PREVIEW_DEVICE="$ssd_device"

          cargo test --lib --locked storage::tests::physical_media_mount_fixture_verifies_separate_devices -- --ignored --exact --nocapture

          sudo umount "$ssd_mount"
          export MY_DRIVE_MOUNT_EXPECT_MISSING=1
          cargo test --lib --locked storage::tests::physical_media_mount_fixture_fails_closed_when_preview_mount_is_missing -- --ignored --exact --nocapture

  publish:
    needs: [validate, database-fixture, physical-mount-fixture]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.build-meta.outputs.release_tag }}
      short_sha: ${{ steps.build-meta.outputs.short_sha }}
      app_image: ${{ steps.images.outputs.app }}
      indexer_image: ${{ steps.images.outputs.indexer }}
      document_preview_image: ${{ steps.images.outputs.document_preview }}
      db_image: ${{ steps.images.outputs.db }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: build-meta
        shell: bash
        run: |
          git fetch --tags --force --quiet || true
          short_sha="${GITHUB_SHA:0:7}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            existing_tag="$(git tag --points-at HEAD 'v*' | sort -V | tail -n 1 || true)"
            if [[ -n "$existing_tag" ]]; then
              release_tag="$existing_tag"
            else
              latest_tag="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
              if [[ -z "$latest_tag" ]]; then
                release_tag="v0.1.0"
              else
                IFS='.' read -r major minor patch <<< "${latest_tag#v}"
                release_tag="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase GHCR image names
        id: images
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'app=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'document_preview=%s-document-preview\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'indexer=%s-indexer\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'db=%s-indexer-db-setup\n' "$repository" >> "$GITHUB_OUTPUT"

      - name: Extract application image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Extract media indexer image metadata
        id: indexer-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.indexer }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Extract document preview image metadata
        id: document-preview-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.document_preview }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Extract indexer database setup image metadata
        id: db-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.db }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          build-args: |
            MY_DRIVE_VERSION=${{ steps.build-meta.outputs.release_tag }}
            MY_DRIVE_GIT_SHA=${{ github.sha }}
            MY_DRIVE_BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
          cache-from: type=gha,scope=my-drive
          cache-to: type=gha,scope=my-drive,mode=max

      - name: Build and publish media indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: media-indexer-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.indexer-meta.outputs.tags }}
          labels: ${{ steps.indexer-meta.outputs.labels }}
          cache-from: type=gha,scope=my-drive-indexer
          cache-to: type=gha,scope=my-drive-indexer,mode=max

      - name: Build and publish isolated document preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: document-preview-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.document-preview-meta.outputs.tags }}
          labels: ${{ steps.document-preview-meta.outputs.labels }}
          cache-from: type=gha,scope=my-drive-document-preview
          cache-to: type=gha,scope=my-drive-document-preview,mode=max

      - name: Build and publish indexer database setup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: media-indexer-db-setup
          platforms: linux/amd64
          push: true
          tags: ${{ steps.db-meta.outputs.tags }}
          labels: ${{ steps.db-meta.outputs.labels }}
          cache-from: type=gha,scope=my-drive-indexer-db-setup
          cache-to: type=gha,scope=my-drive-indexer-db-setup,mode=max

  smoke:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare published image environment
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:7}"
          cat > .env.local <<EOF
          POSTGRES_PASSWORD=ci-postgres-password-0123456789
          MEDIA_INDEXER_PASSWORD=ci-indexer-password-0123456789
          BOOTSTRAP_OWNER_EMAIL=ci-owner@example.invalid
          BOOTSTRAP_OWNER_PASSWORD=ci-bootstrap-password-0123456789
          MY_DRIVE_IMAGE=${repository}:sha-${short_sha}
          MY_DRIVE_DOCUMENT_PREVIEW_IMAGE=${repository}-document-preview:sha-${short_sha}
          MY_DRIVE_INDEXER_IMAGE=${repository}-indexer:sha-${short_sha}
          MY_DRIVE_INDEXER_DB_SETUP_IMAGE=${repository}-indexer-db-setup:sha-${short_sha}
          EOF

      - name: Start published local stack
        run: docker compose --env-file .env.local -f compose.local.yaml up -d

      - name: Wait for app health
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.local -f compose.local.yaml ps
          docker compose --env-file .env.local -f compose.local.yaml logs --no-color
          exit 1

      - name: Verify media indexer database grants
        run: |
          docker compose --env-file .env.local -f compose.local.yaml exec -T \
            db psql -U mydrive -d mydrive -v ON_ERROR_STOP=1 \
            -c "BEGIN; \
                SET LOCAL ROLE media_indexer; \
                SELECT id, owner_id, label, anchor_embedding, auto_merge, updated_at FROM face_clusters WHERE FALSE; \
                SELECT id, file_version_id, cluster_id, recipe_version, face_index, confidence, \
                       box_left, box_top, box_width, box_height, descriptor, created_at \
                  FROM face_observations WHERE FALSE; \
                DELETE FROM face_observations WHERE FALSE; \
                DELETE FROM face_clusters WHERE FALSE; \
                UPDATE face_observations SET cluster_id = cluster_id WHERE FALSE; \
                UPDATE face_clusters SET updated_at = updated_at WHERE FALSE; \
                ROLLBACK;"

      - name: Verify stack health and clean up
        if: always()
        run: |
          docker compose --env-file .env.local -f compose.local.yaml ps
          docker compose --env-file .env.local -f compose.local.yaml down -v

  backup-restore-smoke:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Run encrypted backup and restore smoke
        run: bash scripts/ci-backup-restore-smoke.sh

  release:
    needs: [publish, smoke, backup-restore-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create git tag and tag GHCR images
        id: tag-release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true
          short_sha="${{ needs.publish.outputs.short_sha }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            existing_for_head="$(git tag --points-at "${GITHUB_SHA}" 'v*' | sort -V | tail -n 1 || true)"
            if [[ -n "$existing_for_head" ]]; then
              tag="$existing_for_head"
            else
              tag="${{ needs.publish.outputs.release_tag }}"
              while git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; do
                IFS='.' read -r major minor patch <<< "${tag#v}"
                tag="v${major}.${minor}.$((patch + 1))"
              done
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" "${GITHUB_SHA}" -m "Release ${tag}"
              git push origin "refs/tags/${tag}"
            fi
          fi
          for image in \
            "${{ needs.publish.outputs.app_image }}" \
            "${{ needs.publish.outputs.indexer_image }}" \
            "${{ needs.publish.outputs.document_preview_image }}" \
            "${{ needs.publish.outputs.db_image }}"; do
            docker buildx imagetools create --tag "${image}:${tag}" "${image}:sha-${short_sha}"
          done
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag-release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
          else
            gh release create "$tag" --verify-tag --generate-notes --title "My Drive $tag"
          fi
