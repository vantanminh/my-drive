name: iOS Client (Expo)

on:
  pull_request:
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-client.yml'
  push:
    branches: [master]
    tags: ['ios-v*']
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-client.yml'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload signed IPA to TestFlight (requires App Store Connect secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ios
    outputs:
      has_signing_secrets: ${{ steps.check_signing.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ios/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & sync engine tests
        run: npm test

      - name: Validate Expo app config
        run: npx expo config --type public > /dev/null

      - name: Verify Metro iOS bundle export
        run: |
          npx expo export --platform ios --output-dir dist
          rm -rf dist

      - name: Check Apple signing secrets availability
        id: check_signing
        shell: bash
        env:
          HAS_CERT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' }}
          HAS_PASS: ${{ secrets.IOS_P12_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 != '' }}
          HAS_KEYCHAIN: ${{ secrets.IOS_KEYCHAIN_PASSWORD != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_PASS" = "true" ] && [ "$HAS_PROFILE" = "true" ] && [ "$HAS_KEYCHAIN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  ios-build-simulator:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ios/package-lock.json

      - name: Select Xcode 26+ (Swift 6.2+)
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE_APP=$(python3 -c 'import glob, re; apps = glob.glob("/Applications/Xcode_26*.app") or glob.glob("/Applications/Xcode*.app"); apps.sort(key=lambda p: [int(x) for x in re.findall(r"\d+", p)]); print(apps[-1])')
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: clients/ios/ios
        run: |
          export LANG=en_US.UTF-8
          pod install --repo-update

      - name: Compile iOS Simulator app (Swift + PhotoKit + Expo modules)
        working-directory: clients/ios/ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-sign-ipa:
    needs: verify
    if: needs.verify.outputs.has_signing_secrets == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ios/package-lock.json

      - name: Select Xcode 26+ (Swift 6.2+)
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE_APP=$(python3 -c 'import glob, re; apps = glob.glob("/Applications/Xcode_26*.app") or glob.glob("/Applications/Xcode*.app"); apps.sort(key=lambda p: [int(x) for x in re.findall(r"\d+", p)]); print(apps[-1])')
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci

      - name: Configure temporary keychain & inspect provisioning profile
        id: apple_env
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/mydrive-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/mydrive-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/mydrive-profile.mobileprovision"
          DECODED_PLIST="$RUNNER_TEMP/mydrive-profile.plist"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$DECODED_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$DECODED_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PLIST")
          BUNDLE_ID="${APP_ID#${TEAM_ID}.}"

          HAS_DEVICES=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$DECODED_PLIST" 2>/dev/null || true)
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$DECODED_PLIST" 2>/dev/null || echo "false")

          if [ -n "$HAS_DEVICES" ]; then
            if [ "$GET_TASK_ALLOW" = "true" ]; then
              EXPORT_METHOD="development"
              DEFAULT_IDENTITY="Apple Development"
            else
              EXPORT_METHOD="ad-hoc"
              DEFAULT_IDENTITY="Apple Distribution"
            fi
          else
            EXPORT_METHOD="app-store-connect"
            DEFAULT_IDENTITY="Apple Distribution"
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          DETECTED_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Distribution|iPhone Distribution|Apple Development|iPhone Developer/ { print $2; exit }')
          SIGNING_IDENTITY="${DETECTED_IDENTITY:-$DEFAULT_IDENTITY}"

          MARKETING_VERSION=$(node -e "console.log(require('./package.json').version || '1.0.0')")
          if [[ "${GITHUB_REF_NAME:-}" == ios-v* ]]; then
            MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}"
          fi

          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "export_method=$EXPORT_METHOD" >> "$GITHUB_OUTPUT"
          echo "signing_identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate native iOS project with release identifiers
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ steps.apple_env.outputs.bundle_id }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_MARKETING_VERSION: ${{ steps.apple_env.outputs.marketing_version }}
          APPLE_TEAM_ID: ${{ steps.apple_env.outputs.team_id }}
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: clients/ios/ios
        run: |
          export LANG=en_US.UTF-8
          pod install --repo-update

      - name: Configure manual signing on app target, Archive & Export signed IPA
        working-directory: clients/ios/ios
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.apple_env.outputs.profile_name }}
          TEAM_ID: ${{ steps.apple_env.outputs.team_id }}
          BUNDLE_ID: ${{ steps.apple_env.outputs.bundle_id }}
          EXPORT_METHOD: ${{ steps.apple_env.outputs.export_method }}
          SIGNING_IDENTITY: ${{ steps.apple_env.outputs.signing_identity }}
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          ARCHIVE_PATH="$RUNNER_TEMP/MyDrive.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/MyDriveExport"
          EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/ExportOptions.plist"

          ruby -r xcodeproj -e '
            proj_path = Dir.glob("*.xcodeproj").first or abort("No .xcodeproj found")
            project = Xcodeproj::Project.open(proj_path)
            app_target = project.targets.find { |t| t.product_type == "com.apple.product-type.application" }
            abort("No iOS application target found") unless app_target
            app_target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
              config.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
              config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("BUNDLE_ID")
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_NAME")
              config.build_settings["CODE_SIGN_IDENTITY"] = ENV.fetch("SIGNING_IDENTITY")
            end
            project.save
          '

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive

          python3 -c 'import os, plistlib, sys; plistlib.dump({"method": os.environ["EXPORT_METHOD"], "teamID": os.environ["TEAM_ID"], "signingStyle": "manual", "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]}, "stripSwiftSymbols": True}, open(sys.argv[1], "wb"))' "$EXPORT_OPTIONS_PLIST"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$EXPORT_DIR"

          IPA_FILE=$(find "$EXPORT_DIR" -name '*.ipa' | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "Export succeeded without generating an .ipa file."
            exit 1
          fi
          mkdir -p ../dist
          cp "$IPA_FILE" ../dist/MyDrive-iOS.ipa

      - name: Upload signed IPA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDrive-iOS-ipa
          path: clients/ios/dist/MyDrive-iOS.ipa
          if-no-files-found: error

      - name: Upload IPA to TestFlight (optional)
        if: (inputs.upload_testflight == true || startsWith(github.ref, 'refs/tags/ios-v')) && steps.apple_env.outputs.export_method == 'app-store-connect'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "TestFlight secrets (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_BASE64) not configured; skipping TestFlight upload."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          xcrun altool --upload-app \
            --type ios \
            -f clients/ios/dist/MyDrive-iOS.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Publish tagged iOS GitHub release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          name: MyDrive iOS ${{ github.ref_name }}
          files: clients/ios/dist/MyDrive-iOS.ipa
          body: |
            Signed MyDrive iOS build (`${{ github.sha }}`).

      - name: Cleanup Apple signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mydrive-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/mydrive-cert.p12" \
                "$RUNNER_TEMP/mydrive-profile.mobileprovision" \
                "$RUNNER_TEMP/mydrive-profile.plist" \
                "$RUNNER_TEMP/ExportOptions.plist" \
                "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.apple_env.outputs.profile_uuid }}.mobileprovision" \
                "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 2>/dev/null || true
