name: Windows backup client

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test the backup engine and build the agent
        run: dotnet build clients/windows/MyDrive.Backup.sln --configuration Release && dotnet test clients/windows/MyDrive.Backup.sln --configuration Release --no-build

  installer:
    needs: engine
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Require a new client version when the client changed
        shell: pwsh
        run: ./clients/windows/installer/require-version.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_0/innosetup-6.4.0.exe' -OutFile $setup
          $target = 'C:\InnoSetup6'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target")
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $target 'ISCC.exe'))) {
            throw "Inno Setup did not install (exit $($process.ExitCode))."
          }
          "INNO_SETUP=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
      - name: Build the installer
        shell: pwsh
        run: ./clients/windows/installer/publish.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: MyDriveBackup-Setup
          path: clients/windows/dist/MyDriveBackup-Setup.exe
          if-no-files-found: error
      - name: Publish this client version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-client-v${{ env.CLIENT_VERSION }}
          name: Windows Backup Client ${{ env.CLIENT_VERSION }}
          make_latest: true
          overwrite_files: true
          body: |
            Version **${{ env.CLIENT_VERSION }}**, built from `${{ github.sha }}`.

            Download **MyDriveBackup-Setup.exe** and run it. Clients from 1.1.0 onward can install the next version themselves from Settings.

            The installer is for the current Windows user, does not ask for administrator rights, and already includes the .NET runtime. After it finishes, open **My Drive Backup** from the Start menu and enter the address of your server.

            Uninstalling the app leaves the local backup index in `%LOCALAPPDATA%\MyDriveBackup`. Files already stored on the server are not deleted.

            Windows SmartScreen may say the publisher is unknown. The installer is not code-signed.
          files: clients/windows/dist/MyDriveBackup-Setup.exe
      - name: Update the stable Windows client download
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-backup
          name: Windows Backup Client ${{ env.CLIENT_VERSION }}
          make_latest: false
          overwrite_files: true
          body: |
            Latest Windows backup client: **${{ env.CLIENT_VERSION }}**, built from `${{ github.sha }}`.

            Version history is published as `windows-client-vX.Y.Z`. Installed clients from 1.1.0 onward check that list and can install the newer setup without a manual download.
          files: clients/windows/dist/MyDriveBackup-Setup.exe
