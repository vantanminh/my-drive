name: Windows backup client

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test the backup engine and build the agent
        run: dotnet build clients/windows/MyDrive.Backup.sln --configuration Release && dotnet test clients/windows/MyDrive.Backup.sln --configuration Release --no-build

  installer:
    needs: engine
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_0/innosetup-6.4.0.exe' -OutFile $setup
          $target = 'C:\InnoSetup6'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target")
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $target 'ISCC.exe'))) {
            throw "Inno Setup did not install (exit $($process.ExitCode))."
          }
          "INNO_SETUP=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
      - name: Build the installer
        shell: pwsh
        run: ./clients/windows/installer/publish.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: MyDriveBackup-Setup
          path: clients/windows/dist/MyDriveBackup-Setup.exe
          if-no-files-found: error
      - name: Publish the installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'windows-backup' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Windows Backup Client {0}', github.ref_name) || 'Windows Backup Client' }}
          make_latest: true
          overwrite_files: true
          body: |
            Download **MyDriveBackup-Setup.exe** and run it.

            The installer is for the current Windows user, does not ask for administrator rights, and already includes the .NET runtime. After it finishes, open **My Drive Backup** from the Start menu and enter the address of your server.

            Uninstalling the app leaves the local backup index in `%LOCALAPPDATA%\MyDriveBackup`. Files already stored on the server are not deleted.

            Windows SmartScreen may say the publisher is unknown. The installer is not code-signed.
          files: clients/windows/dist/MyDriveBackup-Setup.exe
